name: build
on:
  pull_request:
  push:
    branches:
    - 1.21.5
    - 1.21.8
    - 1.21.9
    - 1.21.11
    - 26.1
    - 26.2
  release:
    types: [published]
jobs:
  build:
    strategy:
      matrix:
        java: [25]
    runs-on: ubuntu-latest
    steps:
    - name: checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: validate gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: setup jdk ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
    - name: run datagen
      uses: nick-fields/retry@v3
      with:
        max_attempts: 3
        timeout_seconds: 240
        command: sh gradlew runDatagen
    - name: manually delete duplicates
      run: find src/main/resources -type f | while read -r file; do rm -f -- "src/main/generated/${file#src/main/resources/}"; done
    - name: build
      run: sh gradlew build
    - name: capture build artifacts
      if: ${{ matrix.java == '25' }}
      uses: actions/upload-artifact@v4
      with:
        name: Artifacts
        path: build/libs/
